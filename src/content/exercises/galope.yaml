title: El galope
status: borrador
instructions: >-
  Galope: una corchea y dos semicorcheas en cada pulso ("1… y a, 2… y a"), con palm mute. La mano sigue
  moviéndose en semicorcheas: abajo en el número, arriba al aire en la "e" sin tocar la cuerda, abajo en la "y" y
  arriba en la "a". Es la línea de "Corcheas punk en la fundamental", ahora al galope. E al aire, C en el traste 3
  de la A y D en el traste 5 de la A.
tempo:
  start: 60
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [E5, E5, C5, D5, E5, E5, D5, E5]
passCriteria:
  - El galope suena igual en todos los pulsos ("taa-ta-ta"), sin convertirse en tresillo
  - 'La mano no se para en la "e": sube al aire y vuelve a bajar'
  - Los cambios de acorde caen en el primer tiempo sin perder el galope
  - Al terminar, el antebrazo sigue suelto
tags:
  - pua
  - galope
  - semicorcheas
  - palm-mute
  - metal-punk
