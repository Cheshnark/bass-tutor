title: Solo suena la cuerda que tocas
status: borrador
instructions: >-
  Negras en las cuerdas agudas mientras el pulgar mantiene calladas las graves; después, nota y
  silencio: en cada silencio, apoya un dedo sobre la cuerda para cortarla justo en el clic.
  Termina saltando entre la E y la G sin que se mezclen.
tempo:
  start: 60
  target: 80
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - Mientras tocas la D o la G, la E y la A no suenan
  - En los silencios, la nota se corta justo en el clic
  - En los saltos E–G, la E deja de sonar cuando tocas la G
tags:
  - mano-derecha
  - apagado
