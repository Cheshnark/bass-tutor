title: Un tema de jazz completo
status: borrador
instructions: >-
  Un tema original de principio a fin, como se toca en una sesión: intro de cuatro compases (II–V), el tema en
  two-feel (un chorus AABA), un chorus caminando (los solos) y un final repitiendo el giro III–VI–II–V antes del
  último Fmaj7. Más de setenta compases: apréndete el mapa antes de tocar.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Gm7 C7, Gm7 C7, Gm7 C7, Gm7 C7, Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Cm7, F7, Bb7, Bb7, Gm7, C7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Cm7, F7, Bb7, Bb7, Gm7, C7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Am7 D7, Gm7 C7, Am7 D7, Gm7 C7, Fmaj7]
passCriteria:
  - Llegas al final sin parar
  - El cambio de two-feel a walking (segundo chorus) se nota y no acelera
  - Sabes en qué parte del tema estás en todo momento
  - Paras exactamente en el último Fmaj7
tags:
  - jazz
  - forma
  - walking
  - two-feel
