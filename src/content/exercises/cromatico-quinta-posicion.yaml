title: Cromático en quinta posición (un dedo por traste)
status: borrador
instructions: >-
  Mano izquierda en quinta posición: un dedo por traste, del 5 (índice) al 8 (meñique). Sube de la E a la G y
  baja al revés. Aquí los trastes están más juntos y cabe un dedo en cada uno sin forzar.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Cada dedo cae en su traste sin mover la mano de sitio
  - No hay notas que trasteen ni suenen apagadas
  - Si la mano se estira de forma incómoda, vuelves a 1-2-4 y bajas el tempo
tags:
  - mano-izquierda
  - cromatico
  - calentamiento
  - un-dedo-por-traste
