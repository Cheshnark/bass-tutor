title: Parar y volver
status: borrador
instructions: >-
  Un recurso de arreglo muy eficaz: dejar de tocar. Después del estribillo, el bajo calla tres compases del
  puente (la banda sigue; cuenta) y en el cuarto hace un relleno corto con la pentatónica de Sol (D, E D B A) que
  lleva al estribillo. Entra en el 1 con la fundamental, forte.
tempo:
  start: 80
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, D, Em, C, C, D, Em, D, G, D, Em, C, G]
passCriteria:
  - En los compases de silencio no suena nada (apaga bien la última nota del estribillo)
  - Cuentas los compases de silencio y no te adelantas
  - El relleno termina a tiempo y el estribillo entra justo en el 1
tags:
  - rock
  - pop
  - dinamica
  - relleno
  - silencio
