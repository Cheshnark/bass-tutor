title: Notas cortas y espacio
status: borrador
instructions: >-
  Muy pocas notas y muy cortas: la fundamental en el 1 y en la "y" del 2, y la quinta en el 4. El resto, silencio.
  Corta cada nota aflojando el dedo de la mano izquierda (o apoyando la derecha). En el soul, lo que no tocas deja
  sitio a la voz.
tempo:
  start: 70
  target: 100
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, Am, F, G, C, Am, F, G, C]
passCriteria:
  - Las notas son cortas y del mismo largo
  - Los silencios suenan limpios, sin cuerdas al aire
  - El tempo no se acelera aunque haya poco que tocar
tags:
  - soul
  - staccato
  - espacio
