title: Cromático en primera posición (1-2-4)
status: borrador
instructions: >-
  En cada cuerda: al aire, traste 1 (índice), traste 2 (medio) y traste 3 (meñique con el anular). Sube de la
  E a la G y baja al revés. Deja cada dedo apoyado en su traste hasta que necesites el siguiente.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Todas las notas suenan limpias y con la misma duración
  - La mano derecha sigue alternando índice y medio
  - La mano izquierda no se tensa al llegar al traste 3
tags:
  - mano-izquierda
  - cromatico
  - calentamiento
  - digitacion-1-2-4
