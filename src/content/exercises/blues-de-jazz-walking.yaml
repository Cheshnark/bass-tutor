title: El blues de jazz caminado
status: borrador
instructions: >-
  Dos vueltas de walking sobre el blues de jazz en Fa. Compases de un acorde: fundamental, dos notas del acorde y
  aproximación; compases de dos acordes: fundamental y aproximación para cada uno. La tablatura propone dónde
  tocar cada nota, cerca de la primera posición.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, Cm7 F7, Bb7, Bb7, F7, D7, Gm7, C7, F7 D7, Gm7 C7, F7, Bb7, F7, Cm7 F7, Bb7, Bb7, F7, D7, Gm7, C7, F7 D7, Gm7 C7, F7]
passCriteria:
  - Llegas al final de las dos vueltas sin parar
  - En los compases de dos acordes no te adelantas ni te retrasas
  - Puedes cambiar alguna nota del 2 o del 3 por otra del acorde sin perder la regla
tags:
  - jazz
  - blues
  - walking
