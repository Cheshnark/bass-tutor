title: Tríadas de La mayor y La menor
status: borrador
instructions: >-
  La mayor y La menor en quinta posición, un dedo por traste; el número junto a cada nota es el dedo. Mayor:
  dedo 2 en la fundamental (traste 5 de la E), 1 en la tercera, 4 en la quinta y la octava. Menor: dedo 1 en la
  fundamental, 4 en la tercera menor (misma cuerda), 3 en la quinta y la octava. Primero negras, después
  corcheas subiendo y bajando. Suena con batería y acordes.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, Am, Am, A, Am, A, A]
passCriteria:
  - Cambias de forma (mayor/menor) sin pararte en el cambio de compás
  - El meñique llega al traste de la tercera menor sin trastear
  - Oyes la diferencia entre la tercera mayor y la menor
tags:
  - arpegios
  - triadas
  - mayor
  - menor
  - quinta-posicion
