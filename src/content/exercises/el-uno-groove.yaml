title: Todo hacia el uno
status: borrador
instructions: >-
  Un vamp de un solo acorde (E7). El 1 de cada compás, acentuado y largo; después, pocas notas y mucho espacio, y el
  silencio del final del compás deja que el 1 siguiente pese aún más. En el segundo compás de cada pareja, una nota
  en la "a" del 4 anuncia el 1.
tempo:
  start: 80
  target: 108
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [E7, E7, E7, E7, E7, E7, E7, E7, E7]
passCriteria:
  - El 1 suena claramente más fuerte que el resto
  - Los silencios del final del compás se respetan
  - Aunque toques poco, el groove no se para
tags:
  - funk
  - el-uno
  - sincopa
