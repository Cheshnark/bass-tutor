title: Riff con fundamental, quinta y octava
status: borrador
instructions: >-
  Afinación drop D. En cada acorde, la fundamental en la cuarta cuerda, la octava en la segunda y la quinta en la
  tercera, las tres en el mismo traste. Púa alterna. Sobre D todo va al aire; F en el traste 3 y G en el traste 5,
  con el índice apoyado plano sobre las tres cuerdas sin apretar.
tempo:
  start: 60
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [D5, D5, F5, G5, D5, D5, G5, D5]
passCriteria:
  - Alternas abajo y arriba también en los saltos de cuerda
  - Solo suena la nota que tocas (la octava no se mezcla con la fundamental)
  - Los cambios de acorde caen en el primer tiempo sin huecos
  - La fundamental se oye como la nota principal; la quinta y la octava la acompañan
tags:
  - drop-d
  - fundamental
  - quinta
  - octava
  - pua
  - metal-punk
