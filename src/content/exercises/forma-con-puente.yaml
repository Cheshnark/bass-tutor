title: Verso, estribillo y puente
status: borrador
instructions: >-
  La forma completa más corta: verso, estribillo, puente y estribillo. El puente (C D Em D) empieza en otro acorde y
  cambia de dibujo, fundamental y quinta en negras, para que suene distinto. Después vuelve el estribillo como
  antes.
tempo:
  start: 80
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, Em, C, D, G, D, Em, C, C, D, Em, D, G, D, Em, C, G]
passCriteria:
  - Notas que el puente "sale" de la canción y que el último estribillo "vuelve a casa"
  - Cada cambio de sección cae en el 1, sin dudas
  - El último estribillo suena igual que el primero
tags:
  - rock
  - pop
  - forma
  - puente
