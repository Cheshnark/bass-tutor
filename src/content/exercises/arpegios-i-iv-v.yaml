title: Arpegios sobre A, D y E
status: borrador
instructions: >-
  La tríada mayor sobre A (raíz en la E, traste 5), D (raíz en la A, traste 5) y E (raíz en la A, traste 7). La
  forma es la misma en los tres acordes; solo cambia de sitio. Primero negras y luego corcheas.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, D, E, A, A, D, E, A]
passCriteria:
  - Mantienes la misma forma de mano en los tres acordes
  - Los cambios de acorde caen en el 1 sin huecos
  - Las notas suenan parejas y apagadas al cambiar de cuerda
tags:
  - arpegios
  - triadas
  - i-iv-v
  - acordes
