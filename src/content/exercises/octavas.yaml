title: La forma de octava
status: borrador
instructions: >-
  Fundamental con el índice y octava dos cuerdas más arriba y dos trastes más, con el meñique (o el anular).
  Mueve la forma sin cambiarla: G, A, C y D. El índice, apoyado suavemente, calla la cuerda que queda en medio.
  Al final, corcheas en octavas.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - La forma no cambia al moverla por el mástil
  - La cuerda del medio no suena al saltar de la fundamental a la octava
  - La fundamental y la octava suenan con el mismo volumen
tags:
  - octava
  - mastil
  - forma
