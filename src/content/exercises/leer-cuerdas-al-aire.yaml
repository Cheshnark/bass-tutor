title: Leer las cuerdas al aire
status: borrador
instructions: >-
  Solo partitura, sin tablatura. Las cuatro cuerdas al aire en distinto orden: E en la primera línea adicional
  por debajo del pentagrama, A en el primer espacio, D en la línea del medio y G en el último espacio. Di el
  nombre de cada nota en voz alta antes de tocarla.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Sabes qué cuerda es cada nota sin mirar la tablatura
  - No te paras a pensar entre una nota y la siguiente
  - 'Lees por delante: miras la nota siguiente mientras tocas la actual'
tags:
  - lectura
  - clave-de-fa
  - cuerdas-al-aire
