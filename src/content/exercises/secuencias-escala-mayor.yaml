title: Secuencias de la escala mayor
status: borrador
instructions: >-
  La escala mayor de La en secuencias: grupos de tres notas (1-2-3, 2-3-4, 3-4-5…) y saltos de tercera (1-3,
  2-4, 3-5…). Así aprendes a saltar dentro de la escala, no solo a subirla y bajarla.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, A, A]
passCriteria:
  - No te pierdes al empezar cada grupo
  - Las corcheas son regulares aunque cambies de cuerda
  - Usas la misma digitación que en la escala
tags:
  - escalas
  - escala-mayor
  - secuencias
