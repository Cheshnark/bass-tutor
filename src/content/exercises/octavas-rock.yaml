title: Octavas en corcheas
status: borrador
instructions: >-
  Corcheas alternando fundamental y octava (la forma del tronco común: dos cuerdas más arriba, dos trastes más).
  Sobre G, C y D. El índice apoyado calla la cuerda del medio.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, G, C, C, D, D, G, G, G]
passCriteria:
  - La fundamental y la octava suenan igual de fuertes
  - La cuerda del medio no suena
  - El salto de cuerda no rompe la regularidad de las corcheas
tags:
  - rock
  - octava
  - corcheas
