title: Cambio rápido y turnaround con 1-5-♭7-8
status: borrador
instructions: >-
  Fundamental, quinta, séptima menor y octava en negras, con la forma de dos trastes (dedos 1 y 3). La forma
  tiene cambio rápido (D7 en el compás 2) y turnaround (E7 en el 12, que te devuelve al principio).
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: shuffle
backing:
  harmony: [A7, D7, A7, A7, D7, D7, A7, A7, E7, D7, A7, E7, A7]
passCriteria:
  - No te saltas el D7 del compás 2 ni te quedas en él en el 3
  - El E7 del compás 12 suena a "volver al principio"
  - La mano se mueve solo para cambiar de acorde, nunca dentro del compás
tags:
  - blues
  - forma
  - septima
