title: Pasos cromáticos entre acordes
status: borrador
instructions: >-
  La misma progresión, ahora con dos pasos cromáticos al final de cada compás: las dos notas que llevan, de medio en
  medio tono, a la fundamental siguiente (B B♭ → A, G G♭ → F, F F♯ → G, A♯ B → C). Bajan cuando el acorde siguiente
  está más abajo y suben cuando está más arriba.
tempo:
  start: 80
  target: 116
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, Am, F, G, C, Am, F, G, C]
passCriteria:
  - Los dos pasos cromáticos suenan como un camino hacia el acorde siguiente
  - Llegas a cada fundamental justo en el 1
  - Sabes de antemano si el camino sube o baja
tags:
  - soul
  - motown
  - cromatismo
