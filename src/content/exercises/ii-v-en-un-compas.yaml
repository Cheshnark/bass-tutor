title: Dos acordes por compás (I–vi–ii–V)
status: borrador
instructions: >-
  El giro I–vi–ii–V con dos acordes por compás (dos tiempos cada uno): fundamental y, en el tiempo siguiente,
  medio tono hacia la fundamental que viene. C B♭ A E♭ D A♭ G B y vuelta a C: casi todo cromático y en primera
  posición, con cuerdas al aire.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Cmaj7 Am7, Dm7 G7, Cmaj7 Am7, Dm7 G7, Cmaj7 Am7, Dm7 G7, Cmaj7 Am7, Dm7 G7, Cmaj7]
passCriteria:
  - Cada fundamental cae en el 1 o en el 3
  - Las notas de aproximación suenan de paso, no como destino
  - Puedes dar las cuatro vueltas sin perderte en el compás
tags:
  - jazz
  - ii-v-i
  - walking
  - aproximacion
