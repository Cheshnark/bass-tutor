title: Una canción completa
status: borrador
instructions: >-
  Una canción original entera, de principio a fin, con batería y acordes. Intro de dos compases, verso piano en
  negras cortas, pre-estribillo, estribillo forte con octavas, un segundo verso algo más lleno (corcheas, todavía
  piano), puente en el que el bajo calla dos compases y vuelve con un relleno, y estribillo final. Todo lo de este
  itinerario en una sola pieza.
tempo:
  start: 80
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, G, G, Em, C, D, C, D, G, D, Em, C, G, Em, C, D, C, D, G, D, Em, C, C, D, Em, D, G, D, Em, C, G]
passCriteria:
  - Llegas al final sin parar y sin perderte
  - Cada sección suena distinta (dinámica y duración de las notas)
  - El segundo verso suena algo más lleno que el primero, pero menos que el estribillo
  - Tras el silencio del puente, entras a tiempo
tags:
  - rock
  - pop
  - cancion
  - forma
  - dinamica
