title: Un blues entero en shuffle
status: borrador
instructions: >-
  La línea 1-5-6-♭7 en shuffle por todo el blues, con cambio rápido y turnaround. Cuando un acorde dura dos
  compases, el segundo baja (8-♭7-6-5); cuando cambia, vuelve a subir desde la fundamental nueva. La misma forma
  en los tres acordes: A en la cuerda E (traste 5), D y E en la cuerda A (trastes 5 y 7).
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: shuffle
backing:
  harmony: [A7, D7, A7, A7, D7, D7, A7, A7, E7, D7, A7, E7, A7]
passCriteria:
  - Cambias de acorde a tiempo y llegas al final sin perderte
  - El balanceo largo-corto no se pierde al cambiar de cuerda o de posición
  - Al terminar los doce compases podrías empezar otra vuelta sin parar
tags:
  - blues
  - shuffle
  - forma
