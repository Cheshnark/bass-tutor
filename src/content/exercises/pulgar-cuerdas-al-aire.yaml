title: El golpe de pulgar en cuerdas al aire
status: borrador
instructions: >-
  Solo el pulgar (S), en E, A y D al aire: dos compases de negras en cada cuerda y dos de corcheas cortas (golpe y
  silencio). El pulgar rebota en la cuerda, al final del mástil, girando la muñeca. Ni demasiado fuerte ni rozando
  la cuerda de al lado.
tempo:
  start: 60
  target: 96
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [E7, E7, A7, A7, D7, D7, E7, A7, E7]
passCriteria:
  - Cada golpe suena limpio, sin tocar las cuerdas vecinas
  - "El pulgar rebota: no se queda pegado a la cuerda"
  - En las corcheas cortas, el silencio se oye
tags:
  - funk
  - slap
