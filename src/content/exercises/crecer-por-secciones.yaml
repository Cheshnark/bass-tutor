title: Crecer por secciones
status: borrador
instructions: >-
  La misma armonía en tres niveles de energía. Verso, piano (suave) y negras cortas. Pre-estribillo, mezzoforte y
  corcheas. Estribillo, forte, corcheas largas y fundamental-octava. Después del estribillo, el verso vuelve a bajar.
  La fuerza cambia poco: la energía la dan sobre todo la duración de las notas y lo que tocas.
tempo:
  start: 80
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, Em, C, D, C, D, G, D, Em, C, G, Em, C, D, C, D, G, D, Em, C, G]
passCriteria:
  - Se oyen tres niveles distintos (verso, pre-estribillo y estribillo)
  - Al volver al verso, bajas de verdad, sin quedarte en el nivel del estribillo
  - El tempo no cambia con la dinámica (ni corres en el estribillo ni frenas en el verso)
tags:
  - rock
  - pop
  - dinamica
  - forma
