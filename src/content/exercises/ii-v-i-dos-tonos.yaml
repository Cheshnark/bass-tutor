title: El II–V–I en Do y en Fa
status: borrador
instructions: >-
  El mismo II–V–I en dos tonalidades: en Do (Dm7 G7 Cmaj7) y en Fa (Gm7 C7 Fmaj7). Las formas son las mismas; solo
  cambia dónde empiezan. En el jazz, muchos temas encadenan II–V–I en varias tonalidades.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Dm7, G7, Cmaj7, Cmaj7, Gm7, C7, Fmaj7, Fmaj7, Fmaj7]
passCriteria:
  - Tocas las dos tonalidades con las mismas formas, sin pensar nota a nota
  - Sabes decir cuál es el II, el V y el I en Fa
  - El paso de Do a Fa (compás 5) no te frena
tags:
  - jazz
  - ii-v-i
  - arpegio
