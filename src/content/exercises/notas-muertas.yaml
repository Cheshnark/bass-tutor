title: Notas muertas entre fundamentales
status: borrador
instructions: >-
  Corcheas en la fundamental con notas muertas (x en la partitura) entre medias. Para la nota muerta, apoya los
  dedos de la mano izquierda sobre la cuerda sin pisarla y pulsa normal: suena un golpe sin altura. La cuerda al
  aire suena cuando levantas la mano.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, D, D, E, D, A, A]
passCriteria:
  - "Las notas muertas no tienen altura: son un golpe"
  - Las fundamentales suenan limpias y largas
  - El ritmo de notas y notas muertas es regular
tags:
  - groove
  - notas-muertas
  - apagado
  - mano-izquierda
