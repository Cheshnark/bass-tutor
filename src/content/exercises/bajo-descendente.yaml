title: 'Un bajo que baja: acordes con barra'
status: borrador
instructions: >-
  Acordes con barra: el bajo toca la nota de después de la barra (G/B → B). Así la línea baja por grados: C, B,
  A, G, F, E y D, y cierra en G y C. Blancas, primera posición.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, G/B, Am, Am/G, F, C/E, Dm, G, C]
passCriteria:
  - En cada acorde con barra tocas la nota de después de la barra
  - Oyes la línea que baja por grados
  - Las blancas duran dos tiempos completos
tags:
  - pop
  - acordes-con-barra
  - inversiones
  - linea
