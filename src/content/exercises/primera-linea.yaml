title: Tu primera línea
status: borrador
instructions: >-
  Una línea original en primera posición que junta todo lo anterior: corcheas con un silencio, notas pisadas
  con 1-2-4 (traste 2 con el medio, traste 3 con el meñique) y cuerdas al aire. Practícala con la escalera de
  tempo: empieza despacio y sube solo cuando salga limpia.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - El silencio de cada compás se oye (la E se corta a tiempo)
  - Las notas pisadas suenan limpias y las cuerdas que no tocas no suenan
  - Mantienes el tempo en los cambios de cuerda, sin acelerar
  - Al escuchar tu grabación, suena igual de firme de principio a fin
tags:
  - linea
  - ritmo
  - mano-izquierda
  - mano-derecha
