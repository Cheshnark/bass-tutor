title: Cruces de cuerda
status: borrador
instructions: >-
  Corcheas cambiando de cuerda: primero dos notas por cuerda, luego una sola, y al final saltando una
  cuerda (E–D y A–G). La alternancia no se rompe nunca, aunque cambies de cuerda.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - La alternancia índice–medio no se rompe al cambiar de cuerda
  - No aceleras justo antes de los saltos de cuerda
  - Todas las notas suenan con el mismo volumen, también en la cuerda G
tags:
  - mano-derecha
  - alternancia
  - cambio-de-cuerda
