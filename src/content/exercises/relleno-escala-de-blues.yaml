title: Rellenos con la escala de blues
status: borrador
instructions: >-
  El blues con 1-5-♭7-8 en negras y dos rellenos con la escala de blues: en el compás 4 (lleva a D7) y en el 12
  (vuelve a A7). Es el mismo relleno las dos veces (G E · E♭ D · C), en shuffle, y termina un paso antes de la
  fundamental nueva: C sube a D y baja a A.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: shuffle
backing:
  harmony: [A7, D7, A7, A7, D7, D7, A7, A7, E7, D7, A7, E7, A7]
passCriteria:
  - Los rellenos no aceleran y terminan a tiempo
  - Después de cada relleno entras en el 1 con la fundamental
  - El paso de negras a shuffle y de vuelta a negras no mueve el pulso
tags:
  - blues
  - escala
  - relleno
  - shuffle
