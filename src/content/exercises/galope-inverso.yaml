title: Galope y galope inverso
status: borrador
instructions: >-
  El galope (corchea y dos semicorcheas: "1… y a") y el galope inverso (dos semicorcheas y una corchea:
  "1 e y…"). En el inverso: abajo, arriba, abajo, y arriba al aire en la "a". Primero un compás de cada, después
  dos pulsos de cada uno dentro del mismo compás. Todo con palm mute.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Distingues de oído el galope del galope inverso
  - En el galope inverso las dos semicorcheas van al principio del pulso, no al final
  - El cambio de uno a otro dentro del compás no mueve el pulso
  - Cada pulso empieza con la púa hacia abajo
tags:
  - pua
  - galope
  - semicorcheas
  - palm-mute
  - metal-punk
