title: El blues de jazz en two-feel
status: borrador
instructions: >-
  El blues en Fa con los cambios del jazz: un II–V hacia el B♭7 en el compás 4 (Cm7 F7), el D7 del compás 8 que
  lleva al Gm7, y II–V (Gm7 C7) en los compases 9–10 y 12. En blancas: fundamental y quinta, o la fundamental de
  cada acorde cuando hay dos en el compás.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, Cm7 F7, Bb7, Bb7, F7, D7, Gm7, C7, F7 D7, Gm7 C7, F7]
passCriteria:
  - Cambias a tiempo en los compases de dos acordes (4, 11 y 12)
  - Sabes dónde están los II–V de la forma
  - Las blancas duran enteras
tags:
  - jazz
  - blues
  - ii-v-i
