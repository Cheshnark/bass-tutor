title: De two-feel a walking
status: borrador
instructions: >-
  Una progresión de ocho compases (I–vi–ii–V–iii–VI–ii–V en Fa) dos veces: la primera en two-feel (blancas) y la
  segunda caminando. Es lo que se hace a menudo en el jazz: el tema en two-feel y los solos en walking. El cambio
  tiene que notarse, pero sin correr.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7]
passCriteria:
  - El paso a walking (compás 9) llega a tiempo y sin acelerar
  - En two-feel las blancas suenan largas y relajadas
  - Sientes cómo sube la energía al caminar
tags:
  - jazz
  - two-feel
  - walking
