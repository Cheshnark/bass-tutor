title: La forma AABA caminada
status: borrador
instructions: >-
  La misma forma de 32 compases, ahora caminando: un *chorus* completo, como se dice en el jazz a una vuelta entera
  a la forma. Las secciones están rotuladas encima de la partitura.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Cm7, F7, Bb7, Bb7, Gm7, C7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Fmaj7]
passCriteria:
  - Caminas los 32 compases sin parar
  - Cada sección empieza en su sitio
  - Las aproximaciones del cuarto tiempo llevan siempre al acorde siguiente
tags:
  - jazz
  - forma
  - walking
