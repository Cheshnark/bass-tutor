title: Un blues caminado, dos vueltas
status: borrador
instructions: >-
  Dos vueltas al blues en Fa. En la primera, 1-3-5 y aproximación; en la segunda, 1-2-3 (subiendo por la escala)
  y aproximación. Las dos siguen la misma regla: fundamental en el 1, notas del acorde o de la escala en el 2 y
  el 3, y medio tono hacia la fundamental siguiente en el 4.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, F7, Bb7, Bb7, F7, F7, C7, Bb7, F7, C7, F7, Bb7, F7, F7, Bb7, Bb7, F7, F7, C7, Bb7, F7, C7, F7]
passCriteria:
  - Pasas de la primera vuelta a la segunda sin parar
  - Distingues de oído las dos versiones
  - Puedes tocar una tercera vuelta tuya mezclando las dos
tags:
  - jazz
  - blues
  - walking
  - aproximacion
