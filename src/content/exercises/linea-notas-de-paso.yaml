title: Notas de paso entre notas del acorde
status: borrador
instructions: >-
  Notas del acorde en los tiempos 1 y 3 y notas de la escala de La mayor en el 2 y el 4, por grados conjuntos.
  Sobre A, D, E y A. Fíjate en que en los tiempos fuertes siempre hay una nota del acorde.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, D, E, A, A]
passCriteria:
  - En los tiempos 1 y 3 tocas notas del acorde
  - Las notas de paso suenan igual de fuertes y a tiempo
  - Sabes qué notas son de paso en cada compás
tags:
  - escalas
  - linea
  - notas-de-paso
  - i-iv-v
