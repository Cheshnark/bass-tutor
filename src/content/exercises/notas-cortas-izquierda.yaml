title: Cortar notas con la mano izquierda
status: borrador
instructions: >-
  Primero nota y silencio: en cada silencio, afloja la presión del dedo sin despegarlo de la cuerda, para que
  la nota se corte y no suene la cuerda al aire. Después, notas seguidas: que cada una dure hasta la siguiente.
  Dedos: traste 1 índice, traste 2 medio, traste 3 meñique.
tempo:
  start: 60
  target: 84
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - En los silencios, la nota se corta justo en el clic
  - Al aflojar no suena la cuerda al aire
  - En los compases de notas seguidas no hay huecos entre notas
  - Las dos manos empiezan cada nota a la vez
tags:
  - mano-izquierda
  - apagado
  - coordinacion
