title: Caminar sobre el II–V–I
status: borrador
instructions: >-
  Walking sobre Dm7, G7 y Cmaj7, dos veces. En cada compás, la fundamental, dos notas del acorde (subiendo o
  bajando) y, en el cuarto tiempo, medio tono hacia la fundamental siguiente. Fíjate en la línea D C A A♭ G: baja
  por el acorde y llega al G7 por medio tono.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Dm7, G7, Cmaj7, Cmaj7, Dm7, G7, Cmaj7, Cmaj7, Cmaj7]
passCriteria:
  - En cada cuarto tiempo sabes a qué nota vas
  - Las negras suenan largas e iguales
  - Llegas al Cmaj7 con sensación de "llegar a casa"
tags:
  - jazz
  - ii-v-i
  - walking
