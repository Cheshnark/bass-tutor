title: La cuerda B grave
status: borrador
instructions: >-
  Solo con bajo de cinco cuerdas (B E A D G). Con batería. Nota pedal en la B al aire con palm mute, con C (traste
  1) y D (traste 3) encima; después, fundamental, quinta y octava sobre B (B, F# en el traste 2 de la E y B en el 2
  de la A) y sobre D (trastes 3, 5 y 5). El pulgar descansa sobre la B cuando tocas en las cuerdas agudas, para que
  no suene sola.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas
  harmony: [B5, B5, B5, B5, B5, D5, B5, B5]
passCriteria:
  - La B grave suena definida, no como un retumbe
  - Cuando tocas en otras cuerdas, la B no suena por simpatía
  - Las formas de quinta y octava son las mismas que en la cuerda E, una cuerda más abajo
tags:
  - cinco-cuerdas
  - nota-pedal
  - palm-mute
  - metal-punk
