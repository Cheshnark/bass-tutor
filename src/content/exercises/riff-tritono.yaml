title: Riff con tritono en D
status: borrador
instructions: >-
  Afinación drop D. Nota pedal en D con palm mute y el tritono (Ab, traste 6), que se resuelve medio tono abajo
  en G (traste 5). Después una bajada G–F–Eb (trastes 5, 3 y 1) de vuelta a la D. Digitación: índice en el 5 y
  medio en el 6; para la bajada, meñique en el 3 e índice en el 1. Al final, el tritono sin palm mute: D y Ab
  dejándolos sonar.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - El tritono (D–Ab) suena tenso y la G lo resuelve
  - El salto al traste 6 no retrasa la nota
  - Las notas largas del final duran su valor completo
tags:
  - drop-d
  - tritono
  - nota-pedal
  - palm-mute
  - metal-punk
