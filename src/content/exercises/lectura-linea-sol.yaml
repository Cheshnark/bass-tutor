title: Una línea en Sol mayor (con armadura)
status: borrador
instructions: >-
  Una línea en Sol mayor: la armadura (un sostenido en la línea de F) hace que todos los F sean F#, aunque no
  lleven el sostenido al lado. F# en el traste 2 de la E, con el dedo medio. Sobre G, C y D con acompañamiento.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, C, D, G, G, C, D, G]
passCriteria:
  - Tocas F# (no F) en todas las notas F
  - La tocas entera sin pararte
  - Los cambios de acorde caen en el 1
tags:
  - lectura
  - linea
  - armadura
  - acordes
