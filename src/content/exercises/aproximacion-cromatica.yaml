title: Aproximación cromática
status: borrador
instructions: >-
  Siete corcheas en la fundamental y la octava, medio tono por debajo (cuatro primeros compases) o por encima
  (cuatro siguientes) de la fundamental del acorde siguiente. Mano en cuarta posición (índice en el traste 4): A
  y D con el dedo medio en el traste 5, E con el meñique en el 7. La F del compás 6 está en el traste 8:
  desplaza la mano un traste hacia arriba para tocarla con el meñique y vuelve.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, D, E, A, A, D, E, A, A]
passCriteria:
  - La nota de aproximación cae en la última corchea, no antes
  - El acorde siguiente entra en el 1, justo después
  - Distingues de oído la aproximación por debajo y por encima
tags:
  - rock
  - aproximacion
  - cromatico
  - cambio-de-acorde
