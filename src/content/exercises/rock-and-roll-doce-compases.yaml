title: Rock and roll sobre un blues de doce compases
status: borrador
instructions: >-
  El patrón 1-3-5-6-♭7-6-5-3 en corcheas sobre la forma más habitual del rock and roll: el blues de doce
  compases en La (A7, D7 y E7). En cada acorde, la misma forma: para D7, fundamental en la cuerda A (traste 5);
  para E7, también en la cuerda A, dos trastes más arriba (traste 7). Cuenta los compases: el cambio a D7
  llega en el 5, a E7 en el 9.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A7, A7, A7, A7, D7, D7, A7, A7, E7, D7, A7, E7, A7]
passCriteria:
  - Cambias de acorde a tiempo en los compases 5, 7, 9, 10, 11 y 12
  - La forma es la misma en los tres acordes; solo cambia dónde pones el dedo 2
  - Llegas al final sin perderte en la cuenta de compases
tags:
  - rock
  - rock-and-roll
  - blues
  - cambio-de-acorde
