title: El vamp Em7 – A7
status: borrador
instructions: >-
  Dos acordes, dos compases cada uno, durante todo el ejercicio: así son muchos temas de funk. Un groove original con
  fundamental, octava, séptima, quinta y tercera de cada acorde (G sobre Em7, C♯ sobre A7). Las notas cambian con el
  acorde, el ritmo no.
tempo:
  start: 60
  target: 96
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Em7, Em7, A7, A7, Em7, Em7, A7, A7, Em7]
passCriteria:
  - Oyes la diferencia entre la tercera menor (G) y la mayor (C♯)
  - El ritmo es idéntico en los dos acordes
  - Los silencios y las notas muertas están en su sitio
tags:
  - funk
  - vamp
  - dorico
  - semicorcheas
