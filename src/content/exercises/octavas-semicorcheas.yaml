title: Octavas en la "a"
status: borrador
instructions: >-
  La fundamental en cada pulso y la octava en la "a", la última semicorchea antes del pulso siguiente. Es la octava
  "empujada" del funk. Sobre Am7 y D7, el vamp de acorde menor y su dominante.
tempo:
  start: 60
  target: 96
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Am7, Am7, D7, D7, Am7, Am7, D7, D7, Am7]
passCriteria:
  - La octava cae en la "a", pegada al pulso siguiente pero antes de él
  - Hay un silencio claro entre la fundamental y la octava
  - El vamp suena igual de firme en los dos acordes
tags:
  - funk
  - octavas
  - semicorcheas
  - sincopa
