title: El II–V–I menor en Do con arpegios
status: borrador
instructions: >-
  Dm7♭5, G7 y Cm7: el arpegio de cada acorde en negras (1-3-5-7). Dm7♭5 en quinta posición (dedo 1 en la
  fundamental; la ♭5 y la ♭7 con los dedos 2 y 1); G7 y Cm7 con las formas que ya conoces. Fíjate en la nota que
  cambia al llegar a casa: la tercera del G7 es B, y la séptima del Cm7 es B♭.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Dm7b5, G7, Cm7, Cm7, Dm7b5, G7, Cm7, Cm7, Cm7]
passCriteria:
  - Distingues de oído el acorde semidisminuido, el dominante y el menor con séptima
  - El cambio de posición de Dm7♭5 a G7 llega a tiempo
  - Oyes la diferencia entre la B del G7 y la B♭ del Cm7
tags:
  - jazz
  - ii-v-i
  - arpegio
  - menor
