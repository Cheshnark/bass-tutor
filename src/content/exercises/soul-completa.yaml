title: Una canción soul completa
status: borrador
instructions: >-
  Una canción original de principio a fin: intro de dos compases en blancas, verso con la línea de Motown (I–vi–IV–V)
  y estribillo con octavas en corcheas (F G C Am F G C C), dos veces. Las secciones están rotuladas en la partitura.
tempo:
  start: 80
  target: 112
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, C, C, Am, F, G, C, Am, F, G, F, G, C, Am, F, G, C, C, C, Am, F, G, C, Am, F, G, F, G, C, Am, F, G, C, C, C]
passCriteria:
  - Llegas al final sin parar
  - El estribillo sube de energía respecto al verso
  - Las aproximaciones del verso siguen llevando al acorde siguiente
tags:
  - soul
  - motown
  - cancion
  - octavas
