title: 'Sostener y unirse al final del riff'
status: borrador
instructions: >-
  Un arreglo en tres niveles sobre el mismo riff de guitarra. Compases 1–2, sostienes la fundamental en
  corcheas. Compases 3–6, sostienes la primera mitad y te unes a la guitarra en la segunda (D E C). Compases
  7–8, doblas el riff entero. Así el bajo va sumando peso poco a poco sin cambiar de tempo ni de fuerza.
tempo:
  start: 80
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas
  harmony: [A5, A5, A5, A5, A5, A5, A5, A5, A5]
passCriteria:
  - Te unes a la guitarra justo en el tercer tiempo, ni antes ni después
  - Cada nivel suena más lleno que el anterior sin que toques más fuerte
  - Sabes en qué compás estás sin mirar la partitura
tags:
  - rock
  - banda
  - riff
  - arreglo
