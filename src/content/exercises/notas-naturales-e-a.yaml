title: Notas naturales en las cuerdas E y A
status: borrador
instructions: >-
  Recorre las notas naturales (sin sostenidos ni bemoles) de la cuerda E, del traste 0 al 12, y después las de la
  cuerda A. Di el nombre de cada nota en voz alta mientras suena. Mueve la mano por el mástil sin prisa: aquí
  importa saber dónde estás, no la técnica de digitación.
tempo:
  start: 60
  target: 80
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - Dices el nombre de cada nota antes o mientras la tocas
  - Sabes que entre E y F, y entre B y C, solo hay un traste
  - El traste 12 suena igual que la cuerda al aire, una octava más aguda
tags:
  - notas
  - mastil
alphaTex: |
