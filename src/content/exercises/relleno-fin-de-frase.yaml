title: Un relleno al final de la frase
status: borrador
instructions: >-
  Frases de cuatro compases: tres compases de corcheas en la fundamental y, en el cuarto, un relleno corto con
  la pentatónica mayor de Sol (G A B D E) que vuelve a la fundamental en el 1 siguiente.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, C, D, G, G, C, D, G, G]
passCriteria:
  - El relleno ocupa solo el final de la frase
  - Vuelves a la fundamental justo en el 1
  - El relleno no acelera
tags:
  - rock
  - relleno
  - pentatonica
  - frase
