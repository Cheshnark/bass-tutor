title: Leer tablatura
status: borrador
instructions: >-
  Lee solo la tablatura (el pentagrama de abajo, con números). Antes de tocar cada compás, dilo en voz alta:
  "cuerda A, traste 2…". Todo está en primera posición: traste 2 con el medio, traste 3 con el meñique.
tempo:
  start: 60
  target: 80
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - Encuentras cada nota sin mirar la partitura de arriba
  - Sabes decir en qué cuerda y traste está cada nota antes de tocarla
  - Tocas el ejercicio completo sin pararte
tags:
  - lectura
  - tablatura
