title: Un vamp sobre E7
status: borrador
instructions: >-
  Un solo acorde, E7, durante ocho compases. La línea usa las notas del acorde de séptima: fundamental, tercera mayor
  (G♯), quinta, séptima menor y octava. El 1, acentuado. Un vamp de un acorde no aburre si el ritmo está vivo.
tempo:
  start: 60
  target: 96
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [E7, E7, E7, E7, E7, E7, E7, E7, E7]
passCriteria:
  - La tercera mayor (G♯) suena afinada y limpia
  - Los ocho compases suenan iguales
  - El 1 de cada compás sigue siendo el más fuerte
tags:
  - funk
  - vamp
  - dominante
  - semicorcheas
