title: Negras relajadas
status: borrador
instructions: >-
  Negras en la cuerda E al aire y después en la A. No importa la técnica todavía: fíjate solo en
  la postura. Revisa hombros, muñecas y fuerza cada pocos compases y corrige lo que se haya tensado.
tempo:
  start: 60
  target: 72
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - Los hombros siguen bajos y relajados al terminar
  - La muñeca derecha no se dobla en exceso
  - Pulsas suave y el volumen lo pone el ampli o los auriculares
  - Al acabar no notas cansancio ni molestias en el antebrazo
tags:
  - postura
  - cuerdas-al-aire
