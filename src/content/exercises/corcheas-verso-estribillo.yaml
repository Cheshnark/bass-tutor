title: 'Corcheas: verso corto, estribillo largo'
status: borrador
instructions: >-
  Corcheas constantes en la fundamental. En el "verso" (4 primeros compases), notas cortas (staccato, el punto
  sobre la nota): afloja la presión de la mano izquierda justo después de cada nota. En el "estribillo", notas
  largas que se tocan entre sí. Mano en cuarta posición (índice en el traste 4): A y D con el dedo medio en el
  traste 5, E con el meñique en el 7.
tempo:
  start: 80
  target: 130
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, D, E, D, E, A, A, A]
passCriteria:
  - Las corcheas son regulares en todo el ejercicio
  - Se oye la diferencia entre el verso corto y el estribillo largo
  - Las notas cortas se cortan con la izquierda, sin dejar de pulsar a tiempo
tags:
  - rock
  - corcheas
  - fundamental
  - articulacion
