title: Una línea al estilo Motown
status: borrador
instructions: >-
  I–vi–IV–V en Do (C, Am, F, G). En cada compás: la fundamental larga en el 1, la tercera en la "y" del 2 (síncopa),
  quinta y octava, y en la "y" del 4 una nota a medio tono de la fundamental siguiente. Notas del acorde, síncopa y
  cromatismo: los ingredientes del bajo de Motown.
tempo:
  start: 80
  target: 116
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, Am, F, G, C, Am, F, G, C]
passCriteria:
  - La tercera de la "y" del 2 suena a tiempo, sin adelantarse
  - La nota cromática del final lleva al acorde siguiente
  - Las notas suenan con su duración, sin cortarlas
tags:
  - soul
  - motown
  - aproximacion
  - sincopa
