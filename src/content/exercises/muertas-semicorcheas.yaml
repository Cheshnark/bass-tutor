title: Notas muertas en semicorcheas
status: borrador
instructions: >-
  Todas las semicorcheas suenan: las notas, en E al aire; el resto, notas muertas (la mano izquierda apoyada en las
  cuerdas, sin pisar). Dos compases con nota solo en el pulso, dos en el pulso y la "a", dos en el pulso y la "y" y
  dos en el pulso, la "y" y la "a". Las muertas, más suaves que las notas.
tempo:
  start: 60
  target: 92
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7]
passCriteria:
  - Las notas muertas no tienen altura (no suena ninguna nota)
  - Se oye claramente la diferencia entre notas y muertas
  - "La mano derecha no se para nunca: alternancia constante"
tags:
  - funk
  - semicorcheas
  - notas-muertas
