title: "Séptimas de dominante: A7, D7 y E7"
status: borrador
instructions: >-
  Arpegios de séptima de dominante (R 3 5 b7) sobre A7, D7 y E7, como en un blues. A7 con la raíz en la E
  (traste 5); D7 y E7 con la raíz en la A (trastes 5 y 7).
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A7, D7, A7, A7, E7, D7, A7, A7]
passCriteria:
  - La séptima menor (b7) suena con el dedo 2
  - Los cambios caen en el 1
  - Reconoces el sonido "blues" de la séptima de dominante
tags:
  - arpegios
  - cuatriadas
  - septimas
  - i-iv-v
