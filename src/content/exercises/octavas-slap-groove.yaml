title: Octavas en semicorcheas con slap
status: borrador
instructions: >-
  Pulgar, muerta, pop, muerta en cada pulso: fundamental con el pulgar, octava con el pop y notas muertas con el
  pulgar entre medias. Es la base de muchas líneas de funk y disco. Empieza muy despacio.
tempo:
  start: 50
  target: 90
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Em7, Em7, A7, A7, Em7, Em7, A7, A7, Em7]
passCriteria:
  - Las cuatro semicorcheas de cada pulso están igual de separadas
  - Las muertas suenan más suaves que la fundamental y la octava
  - Mantienes el tempo sin tensión en la muñeca
tags:
  - funk
  - slap
