title: La forma AABA en two-feel
status: borrador
instructions: >-
  Una forma original de 32 compases en Fa: A (8), A (8), B (8) y A (8). Las A son casi iguales (la segunda termina
  en Fmaj7); la B (el puente) empieza con un II–V hacia el B♭7. En two-feel, para aprender la forma antes de caminarla.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Fmaj7, Dm7, Gm7, C7, Am7, D7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Cm7, F7, Bb7, Bb7, Gm7, C7, Gm7, C7, Fmaj7, Dm7, Gm7, C7, Am7 D7, Gm7 C7, Fmaj7, Fmaj7, Fmaj7]
passCriteria:
  - Sabes en qué sección estás (A, A, B, A) sin mirar
  - Notas la diferencia entre el final de la primera A y el de la segunda
  - Llegas al final sin perderte
tags:
  - jazz
  - forma
  - two-feel
