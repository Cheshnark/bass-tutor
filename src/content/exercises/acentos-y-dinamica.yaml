title: Suave, fuerte y con acentos
status: borrador
instructions: >-
  Corcheas en la fundamental: un compás suave (p) y otro fuerte (f); después, a volumen medio, acentos (>) en el
  1, la "y" del 2 y el 3, donde suele ir el bombo. Para acentuar, pulsa un poco más fuerte esas notas y relaja
  las demás; el tempo no cambia.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, D, D, E, D, A, A]
passCriteria:
  - Se oye la diferencia entre el compás suave y el fuerte
  - Los acentos destacan sin que el resto desaparezca
  - Al tocar fuerte no aceleras
tags:
  - groove
  - dinamica
  - acentos
