title: El II–V–I en Do con arpegios
status: borrador
instructions: >-
  Dm7, G7 y Cmaj7: el arpegio de cada acorde en negras (1-3-5-7) con las formas de la ampliación común. Dm7 en
  quinta posición (dedo 1 en la fundamental); G7 y Cmaj7 en segunda (dedo 2 en la fundamental). Escucha cómo el G7
  "pide" llegar al Cmaj7.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [Dm7, G7, Cmaj7, Cmaj7, Dm7, G7, Cmaj7, Cmaj7, Cmaj7]
passCriteria:
  - Distingues de oído los tres tipos de acorde (menor, dominante, mayor con séptima)
  - El cambio de posición de Dm7 a G7 llega a tiempo
  - Las séptimas suenan limpias
tags:
  - jazz
  - ii-v-i
  - arpegio
