title: Notas naturales en primera posición
status: borrador
instructions: >-
  Solo partitura. Notas naturales de E a F en primera posición, con la digitación 1-2-4: F con el índice (traste
  1), G y C con el meñique (traste 3), B y E (cuerda D) con el dedo medio (traste 2). Sube y baja por grados y
  al final con saltos. Di el nombre de cada nota.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Encuentras cada nota sin mirar el mástil
  - Usas la digitación 1-2-4 sin mover la mano
  - Los saltos del final no te hacen parar
tags:
  - lectura
  - clave-de-fa
  - notas
  - primera-posicion
alphaTex: |
