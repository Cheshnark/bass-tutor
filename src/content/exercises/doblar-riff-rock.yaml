title: Doblar el riff de la guitarra o sostener
status: borrador
instructions: >-
  Con guitarra y batería. La guitarra toca el mismo riff en los ocho compases (A A C A D E C). En los cuatro
  primeros, tú lo doblas una octava más grave, nota por nota; en los cuatro siguientes, sostienes la fundamental
  en corcheas. Con dedos y en primera posición: C y E con los dedos 4 y 2 (traste 3 y 2), D en la cuerda D al aire.
tempo:
  start: 80
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas
  harmony: [A5, A5, A5, A5, A5, A5, A5, A5, A5]
passCriteria:
  - Al doblar, tus notas y las de la guitarra suenan como una sola
  - La negra del final del riff dura entera, igual que en la guitarra
  - El paso de doblar a sostener (compás 5) no pierde el tempo
  - Sabes decir qué versión prefieres para este riff, y por qué
tags:
  - rock
  - banda
  - riff
  - fundamental
