title: 'Llegar por la quinta: I–vi–IV–V'
status: borrador
instructions: >-
  La misma progresión en negras sobre la fundamental, y en la cuarta negra, la quinta del acorde siguiente: E
  antes de Am, C antes de F, D antes de G y G antes de C.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, Am, F, G, C, Am, F, G, C]
passCriteria:
  - La quinta del acorde siguiente cae en la última negra
  - Oyes cómo la quinta "empuja" hacia el acorde nuevo
  - Encuentras la quinta de cada acorde sin dudar
tags:
  - pop
  - aproximacion
  - quinta
  - cambio-de-acorde
