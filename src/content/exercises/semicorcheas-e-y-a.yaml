title: En la "e", en la "y" y en la "a"
status: borrador
instructions: >-
  Una nota por pulso, cada vez en una semicorchea distinta: dos compases en el pulso, dos en la "e", dos en la "y",
  dos en la "a" y dos mezclando. Cuenta las cuatro semicorcheas en voz alta y toca solo en la que toca; el resto,
  silencio (apaga la cuerda).
tempo:
  start: 60
  target: 90
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7]
passCriteria:
  - Cada nota cae exactamente en su semicorchea
  - "Los silencios son silencios: la cuerda no sigue sonando"
  - En los compases de mezcla no te pierdes
tags:
  - funk
  - semicorcheas
  - sincopa
