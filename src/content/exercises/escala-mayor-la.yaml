title: La escala mayor en La y en Re
status: borrador
instructions: >-
  La escala mayor de una octava en quinta posición: dedo 2 en la fundamental, un dedo por traste y la mano
  quieta. Primero La (raíz en la E, traste 5) en negras, subiendo y bajando; después Re (raíz en la A, traste 5)
  en corcheas. Di el nombre de cada nota mientras la tocas.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, A, A, D, D, D, D]
passCriteria:
  - La mano no se mueve en toda la escala
  - Usas siempre los mismos dedos (los de la partitura)
  - Sabes decir las notas de la escala de La mayor
tags:
  - escalas
  - escala-mayor
  - quinta-posicion
