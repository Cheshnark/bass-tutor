title: Cortes con la banda
status: borrador
instructions: >-
  Con batería. Dos compases de corcheas en E, uno en G (traste 3 de la E) y uno en A (al aire). Después, los
  cortes: en el compás 5 la banda da un golpe en el 1 y se calla; en el 6, golpes en el 1, en la "y" del 2 y en el
  3. En los silencios, apaga la cuerda en el momento exacto: el silencio también se toca. Sigue contando por dentro
  para volver a entrar a tiempo en el compás 7.
tempo:
  start: 90
  target: 150
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas con cortes
  harmony: [E5, E5, G5, A5, E5, E5, E5, E5]
passCriteria:
  - En los cortes, el bajo deja de sonar a la vez que la batería
  - Los golpes del compás 6 caen con el bombo
  - Vuelves a entrar en el compás 7 justo en el 1
tags:
  - banda
  - cortes
  - silencios
  - metal-punk
