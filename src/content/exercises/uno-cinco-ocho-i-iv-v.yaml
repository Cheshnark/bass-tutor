title: 1-5-8 sobre G, C y D
status: borrador
instructions: >-
  El patrón fundamental–quinta–octava–quinta en negras sobre cada acorde. Forma de la mano: índice en la
  fundamental, anular en la quinta y meñique en la octava. G y C en tercera posición; D en quinta posición
  (índice en el traste 5).
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, G, C, C, D, D, G, G]
passCriteria:
  - La forma de la mano es la misma en los tres acordes; solo se mueve de sitio
  - Los cambios de acorde caen en el primer tiempo sin huecos
  - La octava no suena más fuerte que el resto
tags:
  - fundamental
  - quinta
  - octava
  - acordes
  - i-iv-v
