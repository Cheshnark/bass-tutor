title: 'Antes de caminar: fundamental y quinta en blancas'
status: borrador
instructions: >-
  Un blues en Fa con cambio rápido, dos notas por compás: la fundamental en el 1 y la quinta en el 3. Primera
  posición con 1-2-4. Es el esqueleto del walking: si esto sale sin pensar, añadir notas es fácil.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, F7, Bb7, Bb7, F7, F7, C7, Bb7, F7, C7, F7]
passCriteria:
  - Cada blanca dura entera, hasta la nota siguiente
  - Cambias de acorde a tiempo sin mirar la partitura
  - Sientes el balanceo de la batería aunque tus notas sean largas
tags:
  - jazz
  - blues
  - walking
