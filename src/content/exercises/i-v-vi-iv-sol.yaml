title: I–V–vi–IV en Sol
status: borrador
instructions: >-
  La progresión I–V–vi–IV en Sol (G, D, Em, C). Primero negras en la fundamental; después el 1-5-8-5 del tronco
  común en cada acorde (Em con las cuerdas al aire).
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, D, Em, C, G, D, Em, C, G]
passCriteria:
