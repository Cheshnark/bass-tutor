title: La escala de blues de La
status: borrador
instructions: >-
  La pentatónica menor con una nota más, la ♭5 (E♭), entre la cuarta y la quinta. Quinta posición, un dedo por
  traste. Cuatro compases para subir y bajar la escala y cuatro con una línea original en la que la ♭5 solo pasa,
  de D a E. En corcheas rectas, para fijar las notas antes de ponerlas en shuffle.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A7, A7, A7, A7, A7, A7, A7, A7, A7]
passCriteria:
  - Tocas la escala de memoria, subiendo y bajando
  - La ♭5 suena de paso, sin quedarte en ella
  - Las dos versiones de la línea se distinguen solo en el final
tags:
  - blues
  - escala
  - pentatonica
