title: Verso y estribillo
status: borrador
instructions: >-
  Una forma de canción original en Sol, sección a sección: el verso (G Em C D) en negras y el estribillo (G D Em C)
  en corcheas, dos veces. Cada sección dura cuatro compases y su nombre está encima de la partitura. Cuenta los
  compases en voz alta ("uno, dos, tres, cuatro") para saber siempre dónde estás.
tempo:
  start: 80
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [G, Em, C, D, G, D, Em, C, G, Em, C, D, G, D, Em, C, G]
passCriteria:
  - Cambias de negras a corcheas justo en el 1 del estribillo
  - Sabes en qué sección y en qué compás de la sección estás sin mirar la partitura
  - Llegas al final sin perderte
tags:
  - rock
  - pop
  - forma
  - cancion
