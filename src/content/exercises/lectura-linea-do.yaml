title: Una línea en Do mayor
status: borrador
instructions: >-
  Una línea entera en Do mayor (sin alteraciones), solo partitura, sobre C, F y G con acompañamiento. Mezcla
  notas y ritmos de las dos lecciones anteriores. Primero léela despacio sin parar; después, a tempo con la
  batería.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [C, F, G, C, C, F, G, C]
passCriteria:
  - La tocas entera sin pararte, aunque falles alguna nota
  - Los cambios de acorde caen en el 1
  - Respetas puntillos y silencios
tags:
  - lectura
  - linea
  - acordes
