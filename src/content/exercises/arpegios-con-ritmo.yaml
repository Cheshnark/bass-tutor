title: Una línea con las notas del acorde
status: borrador
instructions: >-
  Una línea hecha solo con notas del acorde, pero sin tocarlas en orden: fundamental, fundamental, quinta…
  octava, tercera, quinta. Es el mismo ritmo en cada acorde (A, D y E). Escucha cómo suena a línea de bajo y no
  a ejercicio.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, A, D, D, E, D, A, A]
passCriteria:
  - La fundamental cae siempre en el 1
  - El ritmo es el mismo en todos los compases
  - Los saltos de cuerda no cortan la nota anterior antes de tiempo
tags:
  - arpegios
  - linea
  - fundamental
  - acordes
