title: Anticipar el cambio de acorde
status: borrador
instructions: >-
  Ritmo sincopado: 1, la "y" del 2, el 3 y la "y" del 4. En la "y" del 4 ya tocas la fundamental del acorde
  siguiente y la dejas sonar, ligada, sobre el 1 del compás siguiente (no la vuelves a pulsar). Es una
  anticipación: el bajo llega al acorde antes que el resto.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A, D, E, A, A, D, E, A]
passCriteria:
  - "En el 1 de cada compás no vuelves a pulsar: la nota viene ligada"
  - La "y" del 4 cae justo en medio del 4 y del 1
  - La nota anticipada dura hasta el silencio siguiente
tags:
  - ritmo
  - sincopa
  - anticipacion
  - groove
