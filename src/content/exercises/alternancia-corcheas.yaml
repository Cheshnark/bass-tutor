title: Alternancia en corcheas
status: borrador
instructions: >-
  Corcheas (dos notas por clic) en cada cuerda al aire, dos compases por cuerda. Alterna índice y
  medio en todas las notas, con apoyo. Tócalo una vez empezando con el índice y otra empezando con el medio.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - Alternas índice y medio en todas las notas, sin repetir dedo
  - Las dos corcheas de cada clic suenan igual de fuerte
  - Puedes empezar tanto con el índice como con el medio
  - Cada dedo termina apoyado en la cuerda de abajo
tags:
  - mano-derecha
  - alternancia
  - corcheas
