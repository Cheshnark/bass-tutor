title: Puntillos y silencios
status: borrador
instructions: >-
  Solo partitura y una sola nota (la A al aire): toda la atención al ritmo. Blanca con puntillo (3 tiempos),
  negra con puntillo y corchea (1 y medio + medio), corcheas y silencios. Cuenta "1 y 2 y" en voz alta.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - 'La negra con puntillo dura uno y medio: la corchea siguiente cae en la "y" del 2 (o del 4)'
  - 'Los silencios se notan: la nota se corta a tiempo'
  - Cuentas en voz alta sin perder el pulso
tags:
  - lectura
  - ritmo
  - figuras
  - puntillo
