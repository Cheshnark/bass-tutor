title: Ligaduras
status: borrador
instructions: >-
  Solo partitura y la A al aire. Una ligadura une dos notas iguales: la segunda no se pulsa, se suma a la
  primera. Hay ligaduras dentro del compás y de un compás al siguiente (la nota de la "y" del 4 se prolonga
  sobre el 1).
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
passCriteria:
  - No vuelves a pulsar la nota ligada
  - La nota ligada dura la suma de las dos figuras
  - Las ligaduras sobre la barra no te hacen perder el 1
tags:
  - lectura
  - ritmo
  - ligaduras
  - sincopa
