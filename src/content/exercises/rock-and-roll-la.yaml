title: El patrón de rock and roll en La
status: borrador
instructions: >-
  El patrón 1-3-5-6-♭7-6-5-3 sobre A7, con la forma del arpegio mayor (dedo 2 en la fundamental) más la sexta
  (dedo 1) y la séptima menor (dedo 2) en la cuerda D. Cuatro compases en negras para aprender el dibujo y cuatro
  en corcheas, que es como suena en el rock and roll.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A7, A7, A7, A7, A7, A7, A7, A7, A7]
passCriteria:
  - La mano no se mueve en todo el ejercicio
  - El paso de negras a corcheas (compás 5) no acelera ni frena
  - La ♭7 (G) y la sexta (F#) suenan limpias, sin que se pise la cuerda vecina
tags:
  - rock
  - rock-and-roll
  - arpegio
  - corcheas
