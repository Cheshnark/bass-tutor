title: Un riff con la pentatónica de La
status: borrador
instructions: >-
  Un riff original de dos compases con la pentatónica menor de La en quinta posición (dedos 1 y 4 en la cuerda E,
  1 y 3 en la A). Repítelo cuatro veces igual: un riff funciona porque se repite exacto. Empieza siempre en la
  fundamental, en el 1.
tempo:
  start: 70
  target: 110
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [A5, A5, A5, A5, A5, A5, A5, A5, A5]
passCriteria:
  - Las cuatro repeticiones suenan idénticas
  - La negra del segundo compás dura entera, sin adelantar las dos corcheas siguientes
  - La mano no se mueve de la quinta posición
tags:
  - rock
  - riff
  - pentatonica
