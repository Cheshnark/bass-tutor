title: La menor natural
status: borrador
instructions: >-
  La menor natural de una octava: dedo 1 en la fundamental y dedos 1-3-4, 1-3-4, 1-3 al cambiar de cuerda.
  Negras subiendo y bajando, y al final corcheas.
