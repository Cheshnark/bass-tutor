title: Amaj7, A7 y Am7
status: borrador
instructions: >-
  Tres cuatriadas sobre La, en quinta posición: Amaj7 (la séptima mayor con el dedo 3), A7 (la séptima menor con
  el dedo 2) y Am7 (forma menor con la séptima con el dedo 1). Sube y baja cada una.
tempo:
  start: 60
  target: 90
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [Amaj7, Amaj7, A7, A7, Am7, Am7, A7, A7]
passCriteria:
  - Sabes qué dedo toca la séptima en cada acorde
  - Oyes la diferencia entre maj7, 7 y m7
  - "La mano no se mueve: todo en quinta posición"
tags:
  - arpegios
  - cuatriadas
  - septimas
