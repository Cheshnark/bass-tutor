title: Un groove de slap completo
status: borrador
instructions: >-
  Un groove original de dos compases sobre Em7 que junta todo: pulgar, pop, notas muertas y ligado (H): golpe de
  pulgar en E al aire y, sin volver a pulsar, el dedo 3 cae en el traste 3 (G). Practica cada mitad del compás por
  separado antes de juntarlas.
tempo:
  start: 50
  target: 92
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7, Em7]
passCriteria:
  - El ligado suena casi tan fuerte como el golpe de pulgar
  - Pulgar y pop se alternan sin huecos
  - Puedes tocar los ocho compases sin parar y sin tensión
tags:
  - funk
  - slap
