title: Resistencia en semicorcheas
status: borrador
instructions: >-
  Semicorcheas con púa alterna y palm mute, con compases de negras para recuperar en medio. Primero dos compases
  de semicorcheas; después cuatro y al final cuatro más, con cambios de acorde. En las negras, afloja la mano y
  respira. Si notas que el antebrazo se carga, para aunque no hayas terminado: ese tempo aún no es tu tempo.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [E5, E5, E5, E5, E5, E5, C5, D5, E5, E5, E5, E5, C5, D5, E5]
passCriteria:
  - Las semicorcheas del último bloque suenan tan parejas y a tiempo como las del primero
  - En los compases de negras sueltas la mano y respiras
  - "Terminas sin dolor ni carga en el antebrazo (si la hay: para y baja el tempo)"
  - Las cuerdas que no tocas no suenan
tags:
  - pua
  - semicorcheas
  - resistencia
  - palm-mute
  - metal-punk
