title: Redondas, blancas y negras
status: borrador
instructions: >-
  Cuerdas al aire (E y A) para que toda tu atención vaya al ritmo. Cuenta en voz alta "1, 2, 3, 4" durante todo
  el ejercicio y deja que cada nota dure exactamente lo que vale: la redonda, cuatro tiempos; la blanca, dos;
  la negra, uno.
tempo:
  start: 60
  target: 80
  step: 4
timeSignature: 4/4
feel: straight
passCriteria:
  - Cuentas en voz alta sin parar, también mientras suenan las notas largas
  - Las redondas y las blancas duran todo su valor (no las cortas antes)
  - Cada nota empieza justo con su clic
tags:
  - ritmo
  - figuras
  - contar
alphaTex: |
