title: Con el bombo
status: borrador
instructions: >-
  Pulsa Reproducir y toca con la batería. El bajo suena exactamente donde suena el bombo: en el 1, en la "y" del 2
  y en el 3 de cada compás ("1… y 3…"). Deja que cada nota dure hasta la siguiente. Escucha el bombo más que el
  charles: si tu nota y el bombo suenan como un solo golpe, estás encajado. E al aire, C en el traste 3 de la A y
  D en el 5 de la A.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock con bombo en 1, "y" del 2 y 3
  harmony: [E5, E5, C5, D5, E5, E5, D5, E5]
passCriteria:
  - Tu nota y el bombo suenan como un solo golpe, sin "flam" (dos golpes casi juntos)
  - La nota de la "y" del 2 no se adelanta ni se retrasa
  - Las notas duran hasta la siguiente, sin huecos
tags:
  - banda
  - bombo
  - ritmo
  - metal-punk
