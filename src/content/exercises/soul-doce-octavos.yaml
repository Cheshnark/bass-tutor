title: Balada soul en 12/8
status: borrador
instructions: >-
  Muchas baladas soul van en 12/8: cuatro pulsos por compás, cada uno dividido en tres corcheas ("1 y a, 2 y a…").
  La línea: fundamental larga en el 1, una corchea que lleva al 2, octava en el 3 y quinta y tercera de vuelta.
tempo:
  start: 50
  target: 72
  step: 2
timeSignature: 12/8
feel: straight
backing:
  harmony: [C, Am, F, G, C, Am, F, G, C]
passCriteria:
  - Sientes cuatro pulsos por compás, no doce
  - Las notas largas duran un pulso entero
  - La batería y tú balanceáis igual
tags:
  - soul
  - balada
  - doce-octavos
