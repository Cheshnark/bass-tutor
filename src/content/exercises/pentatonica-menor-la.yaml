title: Pentatónica menor de La
status: borrador
instructions: >-
  La pentatónica menor de La (R b3 4 5 b7): la menor natural sin la segunda ni la sexta. Primero la escala y
  después una línea original con ella sobre Am.
tempo:
  start: 60
  target: 100
  step: 5
timeSignature: 4/4
feel: straight
backing:
  harmony: [Am, Am, Am, Am, Am, Am, Am, Am]
passCriteria:
  - Sabes qué dos notas de la menor natural faltan
  - La línea suena igual en los dos compases que se repiten
  - La fundamental cae en el 1
tags:
  - escalas
  - pentatonica
  - linea
