title: Caminar con el arpegio de séptima
status: borrador
instructions: >-
  Cuatro negras por compás con las notas de cada acorde de séptima: 1-3-5-♭7. Mismo blues en Fa, primera posición,
  con cuerdas al aire. Deja que cada negra suene hasta la siguiente: en el walking las notas son largas.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, F7, Bb7, Bb7, F7, F7, C7, Bb7, F7, C7, F7]
passCriteria:
  - Las cuatro negras de cada compás suenan iguales de largas y de fuertes
  - La fundamental cae siempre en el 1
  - No aceleras al llegar a la séptima
tags:
  - jazz
  - blues
  - walking
  - arpegio
