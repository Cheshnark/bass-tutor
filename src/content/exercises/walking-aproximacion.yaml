title: Llegar por medio tono
status: borrador
instructions: >-
  1-3-5 y, en el cuarto tiempo, una nota a medio tono de la fundamental del compás siguiente: E antes de F, A
  antes de B♭ y B antes de C. La nota de aproximación no es del acorde: suena de paso y se resuelve en el 1.
tempo:
  start: 80
  target: 140
  step: 5
timeSignature: 4/4
feel: swing
backing:
  harmony: [F7, Bb7, F7, F7, Bb7, Bb7, F7, F7, C7, Bb7, F7, C7, F7]
passCriteria:
  - La aproximación cae en el cuarto tiempo y se resuelve en el 1 siguiente
  - Sabes cuál es la fundamental siguiente antes de llegar al cuarto tiempo
  - Las notas siguen sonando largas
tags:
  - jazz
  - blues
  - walking
  - aproximacion
