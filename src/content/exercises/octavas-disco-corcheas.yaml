title: Octavas de disco
status: borrador
instructions: >-
  La línea de octavas del disco: fundamental (dedo 1) y octava (dedo 4) en corcheas, abajo en el pulso y arriba en
  la "y". Am7, Dm7 y Em7: la misma forma, dos cuerdas por encima y dos trastes más. Apaga la cuerda del medio.
tempo:
  start: 90
  target: 124
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [Am7, Am7, Dm7, Em7, Am7, Am7, Dm7, Em7, Am7]
passCriteria:
  - La octava suena igual de fuerte que la fundamental
  - No suena la cuerda del medio al saltar
  - Los cambios de acorde no interrumpen las corcheas
tags:
  - funk
  - disco
  - octavas
