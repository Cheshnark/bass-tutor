title: Punk rápido
status: borrador
instructions: >-
  Con batería. Corcheas en la fundamental sobre E, B, C# y A, dos vueltas. E al aire, B en el traste 2 de la A
  (índice), C# en el 4 (meñique) y A al aire. Todo hacia abajo mientras llegues sin tensión; a partir de ahí, púa
  alterna. Movimiento mínimo y palm mute ligero. El tempo objetivo es alto: súbelo poco a poco y solo cuando el pase
  sea fácil.
tempo:
  start: 120
  target: 170
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas
  harmony: [E5, B5, C#5, A5, E5, B5, C#5, A5, E5]
passCriteria:
  - Las corcheas van con el charles, sin acelerar ni frenar
  - Los cambios de nota caen en el 1 de cada compás
  - Terminas sin carga en el antebrazo (si la hay, baja el tempo o pasa a púa alterna)
tags:
  - banda
  - punk
  - corcheas
  - velocidad
  - metal-punk
