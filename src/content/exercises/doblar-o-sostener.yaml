title: Doblar el riff o sostener la fundamental
status: borrador
instructions: >-
  Con guitarra y batería. La guitarra toca el mismo riff en los ocho compases. En los cuatro primeros, tú lo
  doblas una octava más grave (E E G E A G E D); en los cuatro siguientes, sostienes la fundamental: E en corcheas.
  Todo hacia abajo y con palm mute. Escucha la diferencia: doblar suma peso al riff; sostener deja el riff a la
  guitarra y el bajo hace de suelo.
tempo:
  start: 70
  target: 120
  step: 5
timeSignature: 4/4
feel: straight
backing:
  drums: Rock en corcheas
  harmony: [E5, E5, E5, E5, E5, E5, E5, E5, E5]
passCriteria:
  - Al doblar, tus notas caen a la vez que las de la guitarra
  - Al sostener, las corcheas siguen el charles sin acelerarse
  - El paso de doblar a sostener (compás 5) no pierde el tempo
  - Sabes decir cuál de las dos versiones te gusta más para este riff, y por qué
tags:
  - banda
  - riff
  - fundamental
  - palm-mute
  - metal-punk
