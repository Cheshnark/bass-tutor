title: Pulgar y notas muertas
status: borrador
instructions: >-
  Con el pulgar: nota en el pulso, nota muerta en la "y" (la mano izquierda apoyada, sin pisar) y nota en la "a".
  La muerta es un golpe de percusión, sin altura. Sobre E7 y A7, cuerdas al aire.
tempo:
  start: 56
  target: 88
  step: 4
timeSignature: 4/4
feel: straight
backing:
  harmony: [E7, E7, A7, A7, E7, E7, A7, A7, E7]
passCriteria:
  - La nota muerta no tiene altura
  - Las notas con altura suenan más fuertes que las muertas
  - La mano izquierda pasa de apagar a soltar sin retrasar el golpe
tags:
  - funk
  - slap
