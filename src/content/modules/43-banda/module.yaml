title: Tocar con la banda
summary: >-
  Encajar con el bombo, decidir si doblar el riff o sostener la fundamental, punk rápido sin tensión, cortes y,
  si tienes uno, el bajo de cinco cuerdas. Los ejercicios suenan con batería (y guitarra): vuelve a la afinación
  estándar.
track: metal-punk
lessons:
  - con-la-bateria
  - punk-rapido-y-cortes
  - cinco-cuerdas
