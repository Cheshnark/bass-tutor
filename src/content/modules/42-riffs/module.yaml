title: Riffs graves
summary: >-
  Afinación drop D, riffs con nota pedal, fundamental, quinta y octava en el mismo traste, y los dos sonidos más
  oscuros del metal: la segunda menor del modo frigio y el tritono. Todo el módulo va en drop D.
