title: Riffs de rock
summary: >-
  Riffs con la pentatónica menor y cómo moverlos de acorde, el patrón de rock and roll (1-3-5-6-♭7) sobre un blues
  de doce compases, y qué hacer cuando la guitarra toca un riff: doblarlo, sostener la fundamental o un término medio.
track: rock-pop
lessons:
  - riffs-pentatonica
  - patron-rock-and-roll
  - doblar-el-riff
