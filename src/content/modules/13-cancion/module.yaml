title: La canción entera
summary: >-
  Las partes de una canción (verso, estribillo, puente), cómo cambia el bajo de una sección a otra (duración de las
  notas, dinámica, dejar de tocar) y una canción original completa con la banda, de principio a fin.
track: rock-pop
lessons:
  - estructura-cancion
  - dinamica-por-secciones
  - cancion-completa
