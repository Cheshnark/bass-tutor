name: Publicar en GitHub Pages

# Publica la web en https://<usuario>.github.io/bass-tutor/.
# Requisitos (una sola vez, en GitHub):
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Para publicar automáticamente en cada push a main: Settings → Secrets and variables → Actions →
#      Variables → nueva variable PAGES_ENABLED = true. Sin ella, se publica solo a mano (Actions → Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Comprobar activos de alphaTab en dist
        run: test -s dist/soundfont/sonivox.sf2 && test -s dist/font/Bravura.woff2 && test -s dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
